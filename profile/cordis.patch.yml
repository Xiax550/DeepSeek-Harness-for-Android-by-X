# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# dsh-plugin-android is preinstalled with the app. It contributes two things:
#   * a system-prompt section describing this session's real environment
#     (phone, PRoot sandbox, /sdcard, the `shiz` privileged channel)
#   * an "安卓沙箱" settings page and the terminal rail button
# Remove this row to disable both; the plugin package stays on disk.
- insert:
    - id: android-sandbox
      name: 'dsh-plugin-android'

# The public catalog is hosted on GitHub Pages. The npm package route is more
# reliable on mainland mobile networks while still exposing the same catalog.
- id: dsh-market
  config:
    region: china

# The Android PRoot executor's composed sandbox/approval defaults can be a
# custom pair. An explicit valid default lets the permission preset service
# start instead of failing with "match no preset".
- id: permission
  config:
    defaultPreset: danger-full-access
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
